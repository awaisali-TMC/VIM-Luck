server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip for static assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Cache hashed build assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # HTML entry points must always revalidate — they point at the hashed
    # bundles, and a cached copy keeps users on the previous release until a
    # hard refresh. no-cache = browsers may store but must check freshness.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /supplier.html {
        add_header Cache-Control "no-cache";
    }

    # Supplier portal — /supplier and /supplier/* (router paths like
    # /supplier/pos) serve the supplier entry point. The trailing slash in the
    # prefix keeps the internal portal's /suppliers admin route out of here.
    location = /supplier {
        add_header Cache-Control "no-cache";
        try_files /supplier.html =404;
    }
    location /supplier/ {
        add_header Cache-Control "no-cache";
        try_files $uri /supplier.html;
    }

    # SPA fallback — every route serves index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
